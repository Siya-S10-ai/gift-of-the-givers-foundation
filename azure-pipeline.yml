trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  BuildConfiguration: 'Release'
  BackendPath: 'gog/backend/GOG.API'
  TestProject: 'gog/backend/GOG.API.Tests'
  FrontendPath: 'gog/frontend'
  ArtifactStaging: '$(Build.ArtifactStagingDirectory)'

stages:
- stage: Build_and_Test
  displayName: Build, Test and Package
  jobs:
  - job: Build
    displayName: Build job
    steps:

    - task: UseDotNet@2
      displayName: 'Use .NET SDK 9'
      inputs:
        packageType: sdk
        version: '9.0.x'

    - script: dotnet restore $(BackendPath)/GOG.API.csproj
      displayName: 'dotnet restore (backend)'

    - script: dotnet build $(BackendPath)/GOG.API.csproj -c $(BuildConfiguration) --no-restore
      displayName: 'dotnet build (backend)'

    - script: |
        dotnet test $(TestProject)/GOG.API.Tests.csproj --configuration $(BuildConfiguration) --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test_results.trx"
      displayName: 'Run tests and collect coverage'
      continueOnError: false

    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '**/test_results.trx'
        searchFolder: '$(System.DefaultWorkingDirectory)'
        failTaskOnFailedTests: true

    - script: |
        # install reportgenerator global tool (used to create HTML coverage)
        dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.1.23
        export PATH="$PATH:$HOME/.dotnet/tools"
        # find cobertura reports generated by coverlet
        reportgenerator -reports:**/coverage.cobertura.xml -targetdir:$(Build.ArtifactStagingDirectory)/CoverageReport -reporttypes:Html
      displayName: 'Generate coverage report (ReportGenerator)'

    - task: PublishCodeCoverageResults@1
      displayName: 'Publish code coverage to pipeline'
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(Build.ArtifactStagingDirectory)/coverage.cobertura.xml'
        reportDirectory: '$(Build.ArtifactStagingDirectory)/CoverageReport'

    - script: dotnet publish $(BackendPath)/GOG.API.csproj -c $(BuildConfiguration) -o $(Build.ArtifactStagingDirectory)/backend_publish
      displayName: 'dotnet publish (backend)'

    - task: NodeTool@0
      displayName: 'Use Node 18.x'
      inputs:
        versionSpec: '18.x'

    - script: |
        cd $(FrontendPath)
        npm ci
        npm run build
      displayName: 'Install & build frontend'

    - script: |
        # Copy frontend build output to artifact staging
        mkdir -p $(Build.ArtifactStagingDirectory)/frontend
        cp -R $(FrontendPath)/build/* $(Build.ArtifactStagingDirectory)/frontend/
      displayName: 'Stage frontend build'

    - task: CopyFiles@2
      displayName: 'Copy artifacts to staging'
      inputs:
        SourceFolder: '$(Build.ArtifactStagingDirectory)'
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)/drop'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish build artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/drop'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: Deploy_to_Test
  displayName: Deploy to Azure (Test)
  dependsOn: Build_and_Test
  condition: succeeded()
  jobs:
  - deployment: DeployBackendFrontend
    displayName: Deploy backend & frontend to Azure App Services
    environment: 'test'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:

          - download: current
            artifact: drop

          # Deploy backend App Service
          - task: AzureWebApp@1
            displayName: 'Deploy backend to Azure Web App'
            inputs:
              azureSubscription: 'ADvTECH-Tertiary Rosebank College'     # <-- create / set in pipeline
              appType: 'webApp'
              appName: '$(myBackendApp)'                       # <-- set pipeline variable with our backend app name
              package: '$(Pipeline.Workspace)/drop/backend_publish'

          # Deploy frontend static files to a different App Service or storage account.
          # Option A: Deploy to a separate App Service (if configured to serve static files)
          - task: AzureWebApp@1
            displayName: 'Deploy frontend to Azure Web App (if using standard App Service)'
            inputs:
              azureSubscription: 'ADvTECH-Tertiary Rosebank College'
              appType: 'webApp'
              appName: '$(myFrontendApp)'                      # <-- set pipeline variable with your frontend app name
              package: '$(Pipeline.Workspace)/drop/frontend'
              